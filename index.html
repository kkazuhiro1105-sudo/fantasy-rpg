<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>幻想世界 RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">✦</div>
      <div><p class="eyebrow">FANTASY ROLE-PLAYING GAME</p><h1>幻想世界 RPG</h1></div>
      <span class="version">BROWSER v0.1</span>
    </header>
    <main>
      <section id="title-screen" class="panel title-screen">
        <div class="title-art"><div class="sigil">✧</div><div class="stars">✦　·　✧　·　✦</div></div>
        <p class="eyebrow">A NEW ADVENTURE BEGINS</p>
        <h2>物語の始まり</h2>
        <p class="lead">自分だけの主人公を作り、まだ見ぬ世界への第一歩を踏み出そう。</p>
        <button id="start-button" class="primary large">キャラクター作成を始める</button>
        <p class="small-note">ブラウザ版の開発初期版です。現在は主人公作成まで遊べます。</p>
      </section>

      <section id="creation-screen" class="panel hidden">
        <div class="section-heading">
          <div><p class="eyebrow">CHARACTER CREATION</p><h2>主人公を作成</h2></div>
          <button id="back-title" class="quiet">タイトルへ</button>
        </div>
        <div class="progress-wrap"><div id="progress-bar"></div></div>
        <div class="step-meta"><span id="step-count"></span><span id="step-caption"></span></div>
        <div id="step-content"></div>
        <div class="nav-row">
          <button id="prev-button" class="secondary">戻る</button>
          <button id="next-button" class="primary">次へ</button>
        </div>
      </section>

      <section id="complete-screen" class="panel hidden">
        <p class="eyebrow">CHARACTER CREATED</p>
        <h2>主人公が誕生しました</h2>
        <div id="hero-summary"></div>
        <div class="button-stack">
          <button id="download-hero" class="primary">主人公データをダウンロード</button>
          <button id="restart-button" class="secondary">タイトルへ戻る</button>
        </div>
        <p class="small-note">この初期版では主人公作成まで実装しています。召喚・戦闘・冒険は今後追加します。</p>
      </section>
    </main>
    <footer>Browser RPG Prototype · v0.1</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
